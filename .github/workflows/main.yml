
name: Discord Release Announcement

on:
  release:
    types: [published]

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}

        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is missing."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg content "@everyone 🚀 New RJS Release Available!" \
            --arg title "Revenant Job System ${TAG_NAME}" \
            --arg url "$RELEASE_URL" \
            --arg description "$RELEASE_BODY" \
            '{
              content: $content,
              allowed_mentions: {
                parse: ["everyone"]
              },
              embeds: [{
                title: $title,
                url: $url,
                description: ($description | .[0:3900])
              }]
            }')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
