name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/main.yml

permissions:
  contents: read

jobs:
  announce:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Basch 512 phrase fire test [one-time]'
    runs-on: ubuntu-latest
    steps:
      - name: Load Basch phrase bank
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Publish official RJS announcement or preview Basch phrasing
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          ASSET_URL: ${{ github.event.release.assets[0].browser_download_url }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is missing."
            exit 1
          fi

          PHRASE_BANK=".github/basch-phrases.json"
          if [ ! -f "$PHRASE_BANK" ]; then
            echo "Basch phrase bank is missing: $PHRASE_BANK"
            exit 1
          fi

          mapfile -t RELEASE_OPENERS < <(jq -r '.release_openers[]' "$PHRASE_BANK")
          mapfile -t RELEASE_CLOSERS < <(jq -r '.release_closers[]' "$PHRASE_BANK")
          mapfile -t UPDATE_OPENERS < <(jq -r '.update_openers[]' "$PHRASE_BANK")
          mapfile -t UPDATE_CLOSERS < <(jq -r '.update_closers[]' "$PHRASE_BANK")

          for group in RELEASE_OPENERS RELEASE_CLOSERS UPDATE_OPENERS UPDATE_CLOSERS; do
            eval "count=\${#${group}[@]}"
            if [ "$count" -ne 128 ]; then
              echo "Expected 128 phrases in $group, found $count."
              exit 1
            fi
          done

          pick_random() {
            local -n phrase_array="$1"
            printf '%s' "${phrase_array[$((RANDOM % ${#phrase_array[@]}))]}"
          }

          send_discord_message() {
            local content="$1"
            local title="$2"
            local url="$3"
            local description="$4"
            local allow_everyone="$5"
            local footer="$6"
            local mention_rules='[]'

            if [ "$allow_everyone" = "true" ]; then
              mention_rules='["everyone"]'
            fi

            local payload
            payload=$(jq -n \
              --arg content "$content" \
              --arg title "$title" \
              --arg url "$url" \
              --arg description "$description" \
              --arg footer "$footer" \
              --argjson mentions "$mention_rules" \
              '{
                content: $content,
                allowed_mentions: { parse: $mentions },
                embeds: [{
                  title: $title,
                  url: $url,
                  description: ($description | .[0:3900]),
                  footer: (if $footer == "" then null else { text: $footer } end)
                }]
              }')

            curl -fsS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$DISCORD_WEBHOOK_URL" \
              -o /dev/null
          }

          if [ "$EVENT_NAME" = "release" ]; then
            OPENING="$(pick_random RELEASE_OPENERS)"
            CLOSING="$(pick_random RELEASE_CLOSERS)"
            DOWNLOAD_URL="${ASSET_URL:-$RELEASE_URL}"

            DESCRIPTION="Latest public release: ${TAG_NAME}"$'\n\n'"${RELEASE_BODY}"
            if [ -n "$CLOSING" ]; then
              DESCRIPTION="${DESCRIPTION}"$'\n\n'"${CLOSING}"
            fi
            if [ -n "$DOWNLOAD_URL" ]; then
              DESCRIPTION="${DESCRIPTION}"$'\n\n'"[Download Revenant Job System ${TAG_NAME}](${DOWNLOAD_URL})"
            fi

            CONTENT="@everyone 🚀 ${OPENING}"
            TITLE="Revenant Job System ${TAG_NAME}"
            send_discord_message "$CONTENT" "$TITLE" "$RELEASE_URL" "$DESCRIPTION" "true" ""
            exit 0
          fi

          # Manual workflow_dispatch: 12 style previews using the latest public release v3.4.4.
          # Preview messages preserve the official release embed and ALWAYS disable all mentions.
          BASE_TAG="v3.4.4"
          BASE_TITLE="Revenant Job System ${BASE_TAG}"
          BASE_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/tag/v3.4.4"
          DOWNLOAD_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/download/v3.4.4/Revenant.Job.System.3.4.4.7z"
          BASE_NOTES="- Fixed game not loading at some passages into Rabanastre
          - Claws are now Styles and they have unique Elements and one unique into Time Style with Updated Icons
          - Load Screen Remade with Golden Forged Lion
          - Clan Menu Screen uses Beta Image
          - Arrows, Bombs and even the Shots have Properly name, not just a Short thing to fix all
          Note: the names of the Ammunation was not the error, the error was with a file inside the Map Files, leftover of some descarted devlopment."

          mapfile -t TEST_RELEASE_OPENERS < <(printf '%s\n' "${RELEASE_OPENERS[@]}" | shuf -n 6)
          mapfile -t TEST_UPDATE_OPENERS < <(printf '%s\n' "${UPDATE_OPENERS[@]}" | shuf -n 6)

          for i in 0 1 2 3 4 5; do
            number=$((i + 1))
            opening="${TEST_RELEASE_OPENERS[$i]}"
            closing="$(pick_random RELEASE_CLOSERS)"
            content="🚀 ${opening}"
            description="Latest public release: ${BASE_TAG}"$'\n\n'"${BASE_NOTES}"$'\n\n'"${closing}"$'\n\n'"[Download Revenant Job System ${BASE_TAG}](${DOWNLOAD_URL})"
            footer="Basch voice preview • Release ${number}/6 • No ping"

            send_discord_message "$content" "$BASE_TITLE" "$BASE_URL" "$description" "false" "$footer"
            echo "Sent release-style phrase preview ${number}/6 (all mentions disabled)."
            sleep 1
          done

          for i in 0 1 2 3 4 5; do
            number=$((i + 1))
            opening="${TEST_UPDATE_OPENERS[$i]}"
            closing="$(pick_random UPDATE_CLOSERS)"
            content="${opening}"
            description="Latest public release: ${BASE_TAG}"$'\n\n'"${BASE_NOTES}"$'\n\n'"${closing}"$'\n\n'"[Download Revenant Job System ${BASE_TAG}](${DOWNLOAD_URL})"
            footer="Basch voice preview • Update ${number}/6 • No ping"

            send_discord_message "$content" "$BASE_TITLE" "$BASE_URL" "$description" "false" "$footer"
            echo "Sent update-style phrase preview ${number}/6 (all mentions disabled)."
            sleep 1
          done

          echo "Completed 12 Basch previews from the 512-line phrase bank; all mentions disabled."
