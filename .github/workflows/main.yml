name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"

permissions: {}

jobs:
  announce:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Announce RJS v3.4.4 on Discord'
    runs-on: ubuntu-latest
    steps:
      - name: Announce RJS release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is missing."
            exit 1
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            CONTENT="@everyone 🚀 New RJS Release Available!"
            TITLE="Revenant Job System ${TAG_NAME}"
            URL="$RELEASE_URL"
            DESCRIPTION="$RELEASE_BODY"
          else
            CONTENT="@everyone 🚀 The latest Revenant Job System release is here!"
            TITLE="Revenant Job System v3.4.4"
            URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/tag/v3.4.4"
            DESCRIPTION=$(cat <<'EOF'
**Latest public release: v3.4.4**

- Fixed a loading issue at certain passages in Rabanastre.
- Reworked Claws into Styles, with unique elemental properties and updated icons, including a unique Time Style.
- Remade the loading screen with the Golden Forged Lion.
- Updated the Clan Menu screen with a beta image.
- Corrected the displayed names for Arrows, Bombs, and Shots.
- Fixed the underlying map-file issue caused by leftover data from discarded development.

[Download Revenant Job System v3.4.4](https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/download/v3.4.4/Revenant.Job.System.3.4.4.7z)
EOF
)
          fi

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg description "$DESCRIPTION" \
            '{
              content: $content,
              allowed_mentions: {parse: ["everyone"]},
              embeds: [{
                title: $title,
                url: $url,
                description: ($description | .[0:3900])
              }]
            }')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
