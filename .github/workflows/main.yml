name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Load Basch announcement library
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Publish official RJS announcement or one update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          ASSET_URL: ${{ github.event.release.assets[0].browser_download_url }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is missing."
            exit 1
          fi

          ANNOUNCEMENT_BANK=".github/basch-announcements.json"
          if [ ! -f "$ANNOUNCEMENT_BANK" ]; then
            echo "Basch announcement library is missing."
            exit 1
          fi

          mapfile -t RELEASE_MESSAGES < <(jq -r '.release_announcements[] | @base64' "$ANNOUNCEMENT_BANK")
          mapfile -t UPDATE_MESSAGES < <(jq -r '.update_announcements[] | @base64' "$ANNOUNCEMENT_BANK")

          if [ "${#RELEASE_MESSAGES[@]}" -ne 256 ] || [ "${#UPDATE_MESSAGES[@]}" -ne 256 ]; then
            echo "Expected 256 complete announcements in each category."
            exit 1
          fi

          send_discord_message() {
            local content="$1"
            local title="$2"
            local url="$3"
            local description="$4"
            local allow_everyone="$5"
            local footer="$6"
            local mention_rules='[]'

            if [ "$allow_everyone" = "true" ]; then
              mention_rules='["everyone"]'
            fi

            local payload
            payload=$(jq -n \
              --arg content "$content" \
              --arg title "$title" \
              --arg url "$url" \
              --arg description "$description" \
              --arg footer "$footer" \
              --argjson mentions "$mention_rules" \
              '{
                content: $content,
                allowed_mentions: { parse: $mentions },
                embeds: [{
                  title: $title,
                  url: $url,
                  description: ($description | .[0:3900]),
                  footer: (if $footer == "" then null else { text: $footer } end)
                }]
              }')

            curl -fsS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$DISCORD_WEBHOOK_URL" \
              -o /dev/null
          }

          decode_announcement() {
            printf '%s' "$1" | base64 --decode | jq -r '.body'
          }

          if [ "$EVENT_NAME" = "release" ]; then
            INDEX=$((RANDOM % ${#RELEASE_MESSAGES[@]}))
            ANNOUNCEMENT="$(decode_announcement "${RELEASE_MESSAGES[$INDEX]}")"
            DOWNLOAD_URL="${ASSET_URL:-$RELEASE_URL}"
            DESCRIPTION="$RELEASE_BODY"

            if [ -n "$DOWNLOAD_URL" ]; then
              DESCRIPTION="${DESCRIPTION}"$'\n\n'"[Download Revenant Job System ${TAG_NAME}](${DOWNLOAD_URL})"
            fi

            CONTENT="@everyone"$'\n\n'"${ANNOUNCEMENT}"
            TITLE="Revenant Job System ${TAG_NAME}"
            send_discord_message "$CONTENT" "$TITLE" "$RELEASE_URL" "$DESCRIPTION" "true" ""
            echo "Published official release announcement."
            exit 0
          fi

          # A manual run or the one-time guarded push publishes exactly one Update.
          INDEX=$((RANDOM % ${#UPDATE_MESSAGES[@]}))
          ANNOUNCEMENT="$(decode_announcement "${UPDATE_MESSAGES[$INDEX]}")"
          BASE_TAG="v3.4.4"
          BASE_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/tag/v3.4.4"
          DOWNLOAD_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/download/v3.4.4/Revenant.Job.System.3.4.4.7z"
          BASE_NOTES="- Fixed game not loading at some passages into Rabanastre
          - Claws are now Styles and have unique Elements, including a unique Time Style, with updated icons
          - Remade the Load Screen with the Golden Forged Lion
          - Updated the Clan Menu Screen with the Beta image
          - Corrected the names of Arrows, Bombs, and Shots
          
          Note: The ammunition names were not the cause of the loading issue; it was a leftover file in Map Files from discarded development."
          BASE_DESCRIPTION="Latest public release: ${BASE_TAG}"$'\n\n'"${BASE_NOTES}"$'\n\n'"[Download Revenant Job System ${BASE_TAG}](${DOWNLOAD_URL})"
          send_discord_message "$ANNOUNCEMENT" "Revenant Job System Update • ${BASE_TAG}" "$BASE_URL" "$BASE_DESCRIPTION" "false" "Official Update • Basch"
          echo "Published exactly one Update announcement; all mentions disabled."
