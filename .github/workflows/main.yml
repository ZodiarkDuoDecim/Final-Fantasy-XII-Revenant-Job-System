name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/main.yml

permissions: {}

jobs:
  announce:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Basch style previews [one-time]'
    runs-on: ubuntu-latest
    steps:
      - name: Publish official RJS announcement or preview Basch phrasing
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          ASSET_URL: ${{ github.event.release.assets[0].browser_download_url }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret is missing."
            exit 1
          fi

          send_discord_message() {
            local content="$1"
            local title="$2"
            local url="$3"
            local description="$4"
            local allow_everyone="$5"
            local footer="$6"
            local mention_rules='[]'

            if [ "$allow_everyone" = "true" ]; then
              mention_rules='["everyone"]'
            fi

            local payload
            payload=$(jq -n \
              --arg content "$content" \
              --arg title "$title" \
              --arg url "$url" \
              --arg description "$description" \
              --arg footer "$footer" \
              --argjson mentions "$mention_rules" \
              '{
                content: $content,
                allowed_mentions: { parse: $mentions },
                embeds: [{
                  title: $title,
                  url: $url,
                  description: ($description | .[0:3900]),
                  footer: (if $footer == "" then null else { text: $footer } end)
                }]
              }')

            curl -fsS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$DISCORD_WEBHOOK_URL" \
              -o /dev/null
          }

          RELEASE_PHRASES=(
            "🚀 The latest Revenant Job System release is here!"
            "🚀 I am pleased to report that a new RJS release is now available."
            "🚀 The work continues. The latest Revenant Job System release is ready."
            "🚀 Another milestone has been reached. The latest RJS release is here."
            "🚀 I bring good news: a new Revenant Job System release is now available."
            "🚀 The latest work on the Revenant Job System is now available to all."
            "🚀 The Revenant Job System advances with a new release."
            "🚀 I have news for those following the project: the latest RJS release is available."
            "🚀 Our latest work is ready. The new Revenant Job System release is now available."
            "🚀 A new stage in the Revenant Job System's development is ready to explore."
            "🚀 The newest RJS release has arrived. Its details are recorded below."
            "🚀 I report that the latest Revenant Job System release is now published."
          )

          UPDATE_PHRASES=(
            "The Revenant Job System has received a new update. The details are available below."
            "I bring word of a further update to the Revenant Job System."
            "Our work continues. A new RJS update is ready for review."
            "The project has advanced with another update. Please see the details below."
            "I am pleased to share the latest progress on the Revenant Job System."
            "A new stage of work has been completed. The RJS update details follow."
          )

          if [ "$EVENT_NAME" = "release" ]; then
            OPENING="${RELEASE_PHRASES[$((RANDOM % ${#RELEASE_PHRASES[@]}))]}"
            DOWNLOAD_URL="${ASSET_URL:-$RELEASE_URL}"
            DESCRIPTION="Latest public release: ${TAG_NAME}"$'\n\n'"${RELEASE_BODY}"

            if [ -n "$DOWNLOAD_URL" ]; then
              DESCRIPTION="${DESCRIPTION}"$'\n\n'"[Download Revenant Job System ${TAG_NAME}](${DOWNLOAD_URL})"
            fi

            CONTENT="@everyone ${OPENING}"
            TITLE="Revenant Job System ${TAG_NAME}"
            send_discord_message "$CONTENT" "$TITLE" "$RELEASE_URL" "$DESCRIPTION" "true" ""
            exit 0
          fi

          # Manual workflow_dispatch: phrase previews based on the latest public release v3.4.4.
          # Every preview has pings disabled. Only a real published release can use @everyone.
          BASE_TAG="v3.4.4"
          BASE_TITLE="Revenant Job System ${BASE_TAG}"
          BASE_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/tag/v3.4.4"
          DOWNLOAD_URL="https://github.com/ZodiarkDuoDecim/Final-Fantasy-XII-Revenant-Job-System/releases/download/v3.4.4/Revenant.Job.System.3.4.4.7z"
          BASE_NOTES="- Fixed game not loading at some passages into Rabanastre
          - Claws are now Styles and they have unique Elements and one unique into Time Style with Updated Icons
          - Load Screen Remade with Golden Forged Lion
          - Clan Menu Screen uses Beta Image
          - Arrows, Bombs and even the Shots have Properly name, not just a Short thing to fix all
          Note: the names of the Ammunation was not the error, the error was with a file inside the Map Files, leftover of some descarted devlopment."
          BASE_DESCRIPTION="Latest public release: ${BASE_TAG}"$'\n\n'"${BASE_NOTES}"$'\n\n'"[Download Revenant Job System ${BASE_TAG}](${DOWNLOAD_URL})"

          for i in 0 1 2 3 4 5; do
            number=$((i + 1))
            content="${RELEASE_PHRASES[$i]}"
            footer="Basch phrasing preview • Release style ${number}/6 • No ping"
            send_discord_message "$content" "$BASE_TITLE" "$BASE_URL" "$BASE_DESCRIPTION" "false" "$footer"
            echo "Sent release-style phrase preview ${number}/6 (without @everyone)."
            sleep 1
          done

          for i in 0 1 2 3 4 5; do
            number=$((i + 1))
            content="${UPDATE_PHRASES[$i]}"
            footer="Basch phrasing preview • Update style ${number}/6 • No ping"
            send_discord_message "$content" "$BASE_TITLE" "$BASE_URL" "$BASE_DESCRIPTION" "false" "$footer"
            echo "Sent update-style phrase preview ${number}/6 (without @everyone)."
            sleep 1
          done

          echo "Completed 12 Basch phrasing previews based on ${BASE_TAG}; all mentions disabled."
